{{ define "main" }}
{{ partial "page-header" . }}

<section
  id="content-results"
  class="section pt-4 portfolio-list-page"
  data-filter-root
  data-filter-clear-url="{{ .RelPermalink }}"
>
  <div class="site-container">
    <div class="pt-6">
      <div class="card-grid">
        {{ range .RegularPages.ByDate.Reverse }}
          <div data-filter-item
               data-filter-categories="{{ delimit (apply (.Params.categories | default (slice)) "urlize" ".") "|" }}"
               data-filter-sectors="{{ with .Params.sector }}{{ . | urlize | lower }}{{ end }}">
            {{ partial "components/post-card" (dict "Page" .) }}
          </div>
        {{ end }}
      </div>

      <div class="ui-shell hidden text-center" data-filter-empty>
        <p class="text-text-light dark:text-darkmode-text-light">No portfolio items match the selected filters.</p>
      </div>
    </div>

  </div>
</section>
{{ end }}
